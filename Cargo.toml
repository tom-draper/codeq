[package]
name = "codeq"
version = "0.1.0"
edition = "2021"
description = "A deterministic single source of truth for repository intelligence, built for AI agents."
license = "MIT"

[[bin]]
name = "codeq"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
globset = "0.4.18"
ignore = "0.4"
libc = "0.2.186"
memchr = "2"
regex = "1.13.0"
regex-syntax = "0.8.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
streaming-iterator = "0.1.9"
tempfile = "3.27.0"
toml_edit = { version = "0.23", features = ["serde"] }
tree-sitter = "0.26.10"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-bash = "0.25.1"
tree-sitter-lua = "0.5.0"
tree-sitter-r = "1.3.0"
tree-sitter-julia = "0.23.1"
tree-sitter-scala = "0.26.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.3"
tree-sitter-dart = "0.2.0"
tree-sitter-zig = "1.1.2"
tree-sitter-elixir = "0.3.5"
tree-sitter-solidity = "1.2.13"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-vue-next = "0.1.0"
tree-sitter-css = "0.25.0"
tree-sitter-hcl = "1.1.0"
tree-sitter-powershell = "0.26.4"
tree-sitter-proto = "0.4.0"
tree-sitter-graphql = "0.1.0"
tree-sitter-sequel = "0.3.11"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-html = "0.23"
quick-xml = "0.38"
html-escape = "0.2"
shell-words = "1"
tree-sitter-cmake = "0.7.5"
codebook-tree-sitter-just = "0.1.3"

[profile.release]
# lto = "thin"
# codegen-units = 1
# strip = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
rusqlite = { version = "0.32", features = ["trace"] }
assert_cmd = "2.2.2"
